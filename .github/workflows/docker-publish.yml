name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*' # Publish only on version tag pushes (e.g., v0.21.2-peakflames.6)
  pull_request:
    branches:
      - main
      - peakflames/main
  workflow_dispatch: {} # Manual runs publish only when started from a tag

env:
  REGISTRY: docker.io
  IMAGE_NAME: peakflames/mcp-atlassian

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Needed for checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Create 'X.Y.Z', 'X.Y', 'X' tags on tag push (e.g., v1.2.3 -> 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Only create 'latest' tag if it's a tag push AND it's a non-prerelease version tag (no '-')
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            # Create a tag for PRs (e.g., pr-123) - useful for testing PR builds
            type=ref,event=pr

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        # Only log in when publishing: tag pushes, or manual runs from a tag
        if: github.ref_type == 'tag'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Publish only for tags; PR and branch builds are build-only checks
          push: ${{ github.ref_type == 'tag' }}
          # Use tags and labels from metadata action
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Enable Docker layer caching
          cache-from: type=gha
          cache-to: type=gha,mode=max
